services:
  db:
    image: postgres:latest
    container_name: invest_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/
    networks:
      - springboot-network

volumes:
  postgres_data:

networks:
  springboot-network:
    name: springboot-network