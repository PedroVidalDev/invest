services:
  redis:
    image: redis:latest
    container_name: invest_redis
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    env_file:
      - .env
    volumes:
      - redis-data:/data
    command: redis-server --port ${REDIS_PORT} --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${REDIS_PORT} -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - springboot-network

  db:
    image: postgres:latest
    container_name: invest_postgres
    restart: always
    environment:
      - PGPORT=${POSTGRES_PORT}
    env_file:
      - .env
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -p $${PGPORT}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/
    networks:
      - springboot-network

  api:
    build: .
    container_name: invest_api

    env_file:
      - .env

    ports:
      - "8080:8080"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - springboot-network

volumes:
  postgres_data:

  redis-data:
    driver: local

networks:
  springboot-network:
    name: springboot-network